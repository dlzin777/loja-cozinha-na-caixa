<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido confirmado | Loja Cozinha na Caixa</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    .thanks {
      text-align: center;
      max-width: 520px;
      margin: 0 auto;
    }
    .thanks h1 { color: #066677; margin-bottom: 8px; }
    .thanks .ok-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: #eaf7e8; color: #59ad36;
      display: grid; place-items: center;
      font-size: 36px; margin: 0 auto 16px;
    }
    .code-box {
      background: #f7f7f7; border-radius: 8px;
      padding: 12px; margin: 18px 0; font-weight: 700;
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-card thanks">
      <div class="ok-icon">✓</div>
      <h1>Pagamento confirmado!</h1>
      <p>Obrigado pela compra. Seu Pix foi aprovado com sucesso.</p>
      <div class="code-box">Pedido: <span id="orderCode">—</span></div>
      <p class="subtitle">Você também pode acompanhar o status em <a href="conta.html">Minha conta</a>.</p>
      <a class="btn-auth" href="index.html" style="display:inline-block;width:auto;padding:13px 28px;text-decoration:none">Voltar à loja</a>
    </div>
  </div>
  <script>
    const code = new URLSearchParams(location.search).get("code");
    if (code) document.getElementById("orderCode").textContent = code;
  </script>
</body>
</html>
