  <link rel="stylesheet" href="/css/auth.css" />

<body class="auth-page">
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="auth-logo" href="/">
        <img src="/img/logo-reino-da-pedra.png" alt="Reino da Pedra" />
      </a>
      <h1>Criar conta</h1>
      <p class="subtitle">Salve seus dados e acompanhe seus pedidos</p>
      <div id="authMsg" class="auth-msg"></div>
      <form id="registerForm">
        <label class="field">
          <span>Nome completo</span>
          <input type="text" id="name" required autocomplete="name" placeholder="Seu nome" />
        </label>
        <label class="field">
          <span>E-mail</span>
          <input type="email" id="email" required autocomplete="email" placeholder="seu@email.com" />
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres, letras e números" />
        </label>
        <button class="btn-auth" type="submit">Criar conta</button>
      </form>
      <p class="auth-switch">
        Já tem conta?
        <a id="loginLink" href="login.html">Entrar</a>
      </p>
    </div>
  </div>
  <script src="/js/meta-pixel.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get("next");
    if (next) {
      document.getElementById("loginLink").href = `login.html?next=${encodeURIComponent(next)}`;
    }
  </script>
</body>
</html>
