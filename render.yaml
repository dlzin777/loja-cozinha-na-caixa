# Blueprint opcional do Render — você também pode criar o serviço pelo painel.
services:
  - type: web
    name: nova-oferta
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: BRAVOPAY_API_KEY
        sync: false
      - key: BRAVOPAY_PRODUCT_ID
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.13.4"
    disk:
      name: loja-data
      mountPath: /var/data
      sizeGB: 1
